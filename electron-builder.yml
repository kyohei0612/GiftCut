# 配布物（インストーラ）の作り方。
#
#   npm run dist        … 署名なしのインストーラを作る（out → dist/）
#
# 署名について:
#   Windows は署名が無いと、初回起動で SmartScreen の警告が出る（「不明な発行元」）。
#   消すにはコードサイニング証明書（有料・年契約）が要る。取得したら
#   win.certificateFile / certificatePassword（または環境変数 CSC_LINK / CSC_KEY_PASSWORD）
#   を足すだけで、この設定のまま署名付きになる。
#
# 自動更新について:
#   GitHub の Releases に置いたものを、起動時に見に行って当てる（publish: を参照）。
#   出し方:
#     1. package.json の version を上げる
#     2. GH_TOKEN=... npm run release   （tag を打ってビルドし、Releases に上げる）
#   置き場所のリポジトリは **公開** であること。非公開だと、配る相手全員に
#   読み取り用トークンを渡すことになり、配布物にトークンを埋める羽目になる。

publish:
  provider: github
  owner: kyohei0612
  repo: GiftCut
  releaseType: release

appId: jp.giftcut.app
productName: GiftCut
copyright: © kyohei

directories:
  output: dist
  buildResources: build

# 配布物に入れるもの。
#
# **SE/ と telop-presets/ は入れない。** 効果音ラボ由来のSEと Geba のテロップ
# スタイルは再配布が禁止されているため（.gitignore にも同じ理由で入っている）。
# ここを間違えると、配布した時点で規約違反になる。
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,__tests__,tests,example,examples}/**'

# テンプレート（プロジェクトの雛形）は同梱する。
# アプリはこれを「テンプレート」フォルダから読む。
# ライセンスの表示は**アプリのフォルダの一番上**に置く（resources の奥ではなく）。
# LGPL は「使っていることを知らせ、本文を添える」ことを求めるので、
# 受け取った人がすぐ見つけられる場所でないと意味がない。
extraFiles:
  - from: licenses
    to: licenses

extraResources:
  - from: テンプレート
    to: テンプレート
    filter:
      - '**/*.gcproj'
  # ffmpeg / ffprobe を同梱する。相手の PC には入っていないので、
  # これが無いと読み込みも波形も書き出しも動かない。
  #
  # **置くのは LGPL 版だけ。** GPL 版（x264 入り）を置くと、GiftCut 全体を
  # GPL で配ることになる。`npm run check:ffmpeg` が見張っている。
  - from: resources/ffmpeg
    to: ffmpeg

win:
  target:
    - target: nsis
      arch:
        - x64
  # 署名はまだ。証明書を用意したらここに certificateFile を足す

# プロジェクトファイルを GiftCut に結び付ける。
# **これが無いと、保存した .gcproj をダブルクリックしても
# 「メモ帳で開きますか？」になる。** 作った本人が自分のファイルを開けない。
fileAssociations:
  - ext: gcproj
    name: GiftCut プロジェクト
    description: GiftCut のプロジェクト
    role: Editor

nsis:
  oneClick: false # 置き場所を選べるようにする（既定の一発インストールにしない）
  allowToChangeInstallationDirectory: true
  perMachine: false # ユーザー単位。管理者権限を求めない
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GiftCut

